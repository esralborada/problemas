<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mates 2º: Desafío con Código</title>
    <style>
        :root { --primary: #6366f1; --secondary: #f43f5e; --bg: #f8fafc; --accent: #10b981; --dark: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .config-panel { background: white; padding: 15px 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        select { padding: 10px; border-radius: 8px; border: 2px solid var(--primary); font-size: 1em; outline: none; cursor: pointer; }

        #game-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1000px; width: 100%; }
        
        .main-panel { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .tag { background: #e0e7ff; color: #4338ca; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8em; }
        
        #enunciado { font-size: 1.4em; line-height: 1.6; margin: 30px 0; min-height: 100px; color: #334155; }
        
        .answer-zone { display: flex; gap: 10px; align-items: center; }
        input[type="number"] { width: 120px; padding: 15px; font-size: 1.5em; border: 3px solid #cbd5e1; border-radius: 10px; outline: none; }
        .btn-check { background: var(--accent); color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        /* Calculadora con Estado Bloqueado */
        .calc-panel { background: var(--dark); padding: 20px; border-radius: 20px; color: white; position: relative; transition: all 0.5s; }
        .calc-panel.locked { border: 3px solid var(--secondary); opacity: 0.9; }
        .calc-panel.unlocked { border: 3px solid var(--accent); }
        
        .calc-screen { background: #334155; padding: 15px; text-align: right; font-family: monospace; font-size: 1.2em; border-radius: 10px; margin-bottom: 15px; min-height: 30px; color: #6ee7b7; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { background: #475569; border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; }
        .calc-btn:hover { background: #64748b; }
        .calc-btn.op { background: #f59e0b; }
        
        #calc-status { font-size: 0.7em; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .status-msg { color: var(--secondary); font-weight: bold; }
        .unlocked .status-msg { color: var(--accent); }

        #feedback { margin-top: 20px; font-weight: bold; font-size: 1.2em; height: 30px; }

        @media (max-width: 800px) {
            #game-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="config-panel">
    <strong>Practicar:</strong>
    <select id="selector-categoria" onchange="generarProblema()">
        <option value="aleatorio">🎲 Todo mezclado</option>
        <option value="Suma sin llevada">➕ Suma sin llevada</option>
        <option value="Suma con llevada">🚀 Suma con llevada</option>
        <option value="Resta sin llevada">➖ Resta sin llevada</option>
        <option value="Resta con llevada">📉 Resta con llevada</option>
        <option value="Suma y resta llevando">🔄 Mix Suma/Resta</option>
        <option value="Multiplicar">✖️ Multiplicar (0-9)</option>
    </select>
</div>

<div id="game-container">
    <div class="main-panel">
        <span id="tag" class="tag">Categoría</span>
        <div id="enunciado">Cargando problema...</div>
        <div class="answer-zone">
            <input type="number" id="respuesta-usuario" placeholder="?" autocomplete="off">
            <button class="btn-check" onclick="verificarRespuesta()">Comprobar</button>
        </div>
        <div id="feedback"></div>
        <div style="margin-top:20px">Puntos: <strong id="puntos">0</strong></div>
    </div>

    <!-- CALCULADORA CON BLOQUEO -->
    <div id="calc-panel" class="calc-panel locked">
        <div id="calc-status">
            <span>Calculadora</span>
            <span id="lock-text" class="status-msg">BLOQUEADA 🔒</span>
        </div>
        <div id="calc-display" class="calc-screen">Introduce PIN</div>
        <div class="calc-grid">
            <button class="calc-btn op" style="grid-column: span 2" onclick="clearCalc()">Limpiar</button>
            <button class="calc-btn op" onclick="addCalc('/')">÷</button>
            <button class="calc-btn op" onclick="addCalc('*')">×</button>
            
            <button class="calc-btn" onclick="addCalc('7')">7</button>
            <button class="calc-btn" onclick="addCalc('8')">8</button>
            <button class="calc-btn" onclick="addCalc('9')">9</button>
            <button class="calc-btn op" onclick="addCalc('-')">-</button>
            
            <button class="calc-btn" onclick="addCalc('4')">4</button>
            <button class="calc-btn" onclick="addCalc('5')">5</button>
            <button class="calc-btn" onclick="addCalc('6')">6</button>
            <button class="calc-btn op" onclick="addCalc('+')">+</button>
            
            <button class="calc-btn" onclick="addCalc('1')">1</button>
            <button class="calc-btn" onclick="addCalc('2')">2</button>
            <button class="calc-btn" onclick="addCalc('3')">3</button>
            <button class="calc-btn op" onclick="solveCalc()">=</button>
            
            <button class="calc-btn" style="grid-column: span 3" onclick="addCalc('0')">0</button>
            <button class="calc-btn" onclick="addCalc('.')">.</button>
        </div>
    </div>
</div>

<script>
let puntos = 0;
let respuestaCorrecta;
let calculadoraDesbloqueada = false;
const codigoSecreto = "2468"; // <--- PUEDES CAMBIAR EL CÓDIGO AQUÍ

// --- Lógica Juego ---
function generarProblema() {
    let cat = document.getElementById('selector-categoria').value;
    if (cat === "aleatorio") {
        const opciones = ["Suma sin llevada", "Suma con llevada", "Resta sin llevada", "Resta con llevada", "Suma y resta llevando", "Multiplicar"];
        cat = opciones[Math.floor(Math.random() * opciones.length)];
    }
    document.getElementById('tag').innerText = cat;
    document.getElementById('respuesta-usuario').value = "";
    document.getElementById('respuesta-usuario').focus();
    document.getElementById('feedback').innerText = "";

    let a, b, texto;
    const n = ["Hugo", "Sofía", "Leo", "Martina"][Math.floor(Math.random()*4)];
    const o = ["cromos", "canicas", "uvas"][Math.floor(Math.random()*3)];

    // Reutilizamos la lógica simplificada de las categorías anteriores
    if (cat.includes('Suma')) {
        a = Math.floor(Math.random()*50)+10; b = Math.floor(Math.random()*40)+10;
        respuestaCorrecta = a + b; texto = `${n} tiene ${a} ${o} y recibe ${b}. ¿Total?`;
    } else if (cat.includes('Resta')) {
        a = 80; b = 30; // Simplificado para el ejemplo
        respuestaCorrecta = a - b; texto = `${n} tenía ${a} ${o} y pierde ${b}. ¿Quedan?`;
    } else if (cat.includes('Multiplicar')) {
        a = Math.floor(Math.random()*10); b = Math.floor(Math.random()*10);
        respuestaCorrecta = a * b; texto = `¿Cuánto es ${a} veces ${b} ${o}?`;
    } else {
        respuestaCorrecta = 10; texto = "Problema de prueba: 5 + 5";
    }
    document.getElementById('enunciado').innerText = texto;
}

function verificarRespuesta() {
    if (parseInt(document.getElementById('respuesta-usuario').value) === respuestaCorrecta) {
        puntos += 10; document.getElementById('puntos').innerText = puntos;
        document.getElementById('feedback').innerText = "¡Muy bien! 🌟";
        setTimeout(generarProblema, 1500);
    } else {
        document.getElementById('feedback').innerText = "¡Inténtalo otra vez! 💪";
    }
}

// --- Lógica Calculadora con PIN ---
let calcVal = "";

function addCalc(v) {
    if (!calculadoraDesbloqueada) {
        calcVal += v;
        document.getElementById('calc-display').innerText = "*".repeat(calcVal.length);
        
        if (calcVal === codigoSecreto) {
            desbloquear();
        } else if (calcVal.length >= 4) {
            calcVal = "";
            document.getElementById('calc-display').innerText = "PIN INCORRECTO";
            setTimeout(() => { if(!calculadoraDesbloqueada) document.getElementById('calc-display').innerText = "Introduce PIN"; }, 1000);
        }
        return;
    }
    // Si ya está desbloqueada, funciona normal
    calcVal += v;
    document.getElementById('calc-display').innerText = calcVal;
}

function desbloquear() {
    calculadoraDesbloqueada = true;
    calcVal = "";
    document.getElementById('calc-panel').classList.remove('locked');
    document.getElementById('calc-panel').classList.add('unlocked');
    document.getElementById('lock-text').innerText = "DESBLOQUEADA ✅";
    document.getElementById('calc-display').innerText = "¡LISTO!";
    setTimeout(() => { document.getElementById('calc-display').innerText = ""; }, 1000);
}

function clearCalc() { calcVal = ""; document.getElementById('calc-display').innerText = calculadoraDesbloqueada ? "" : "Introduce PIN"; }

function solveCalc() {
    if (!calculadoraDesbloqueada) return;
    try {
        calcVal = eval(calcVal).toString();
        document.getElementById('calc-display').innerText = calcVal;
    } catch { clearCalc(); }
}

generarProblema();
</script>
</body>
</html>
