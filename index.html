<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuest 2º - Versión Segura</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #f43f5e;
            --bg: #f1f5f9;
            --accent: #10b981;
            --dark: #1e293b;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header-panel {
            background: var(--white);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 940px;
            box-sizing: border-box;
        }

        select {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            font-size: 1em;
            flex-grow: 1;
        }

        #game-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .main-panel {
            background: var(--white);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85em;
        }

        #enunciado {
            font-size: 1.5em;
            line-height: 1.5;
            color: #334155;
            margin: 30px 0;
            min-height: 120px;
        }

        .answer-zone {
            display: flex;
            gap: 15px;
        }

        input[type="number"] {
            width: 140px;
            padding: 18px;
            font-size: 1.8em;
            border: 3px solid #cbd5e1;
            border-radius: 15px;
        }

        .btn-check {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3em;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Calculadora */
        .calc-panel {
            background: var(--dark);
            padding: 25px;
            border-radius: 25px;
            color: white;
            border: 4px solid var(--secondary);
        }

        .calc-panel.unlocked { border-color: var(--accent); }

        .calc-screen {
            background: #0f172a;
            padding: 20px;
            text-align: right;
            font-family: monospace;
            font-size: 1.4em;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 35px;
            color: #10b981;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 18px 5px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
        }

        .calc-btn.op { background: #f59e0b; }

        #feedback {
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.3em;
            height: 30px;
        }

        @media (max-width: 850px) {
            #game-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header-panel">
    <strong>Categoría:</strong>
    <select id="selector-categoria" onchange="generarProblema()">
        <option value="aleatorio">🎲 Mezclar todo</option>
        <option value="Suma sin llevada">➕ Sumas sencillas</option>
        <option value="Suma con llevada">🚀 Sumas con llevada</option>
        <option value="Resta sin llevada">➖ Restas sencillas</option>
        <option value="Resta con llevada">📉 Restas con llevada</option>
        <option value="Suma y resta llevando">🔄 Suma y Resta</option>
        <option value="Multiplicar">✖️ Multiplicar</option>
    </select>
</div>

<div id="game-container">
    <div class="main-panel">
        <span id="tag" class="tag">Cargando...</span>
        <div id="enunciado">Preparando el reto...</div>
        <div class="answer-zone">
            <input type="number" id="respuesta-usuario" placeholder="?" autocomplete="off">
            <button class="btn-check" onclick="verificarRespuesta()">Comprobar</button>
        </div>
        <div id="feedback"></div>
        <div style="margin-top:20px; color: #64748b;">Puntos: <strong id="puntos" style="color:var(--primary)">0</strong></div>
    </div>

    <div id="calc-panel" class="calc-panel">
        <div style="font-size:0.7em; margin-bottom:10px; display:flex; justify-content:space-between">
            <span>CALCULADORA</span>
            <span id="lock-status">BLOQUEADA 🔒</span>
        </div>
        <div id="calc-display" class="calc-screen">Introducir PIN</div>
        <div class="calc-grid">
            <button class="calc-btn" style="grid-column: span 2; background:#ef4444" onclick="clearCalc()">C</button>
            <button class="calc-btn op" onclick="addCalc('/')">÷</button>
            <button class="calc-btn op" onclick="addCalc('*')">×</button>
            
            <button class="calc-btn" onclick="addCalc('7')">7</button>
            <button class="calc-btn" onclick="addCalc('8')">8</button>
            <button class="calc-btn" onclick="addCalc('9')">9</button>
            <button class="calc-btn op" onclick="addCalc('-')">-</button>
            
            <button class="calc-btn" onclick="addCalc('4')">4</button>
            <button class="calc-btn" onclick="addCalc('5')">5</button>
            <button class="calc-btn" onclick="addCalc('6')">6</button>
            <button class="calc-btn op" onclick="addCalc('+')">+</button>
            
            <button class="calc-btn" onclick="addCalc('1')">1</button>
            <button class="calc-btn" onclick="addCalc('2')">2</button>
            <button class="calc-btn" onclick="addCalc('3')">3</button>
            <button class="calc-btn op" style="background:var(--accent)" onclick="solveCalc()">=</button>
            
            <button class="calc-btn" style="grid-column: span 3" onclick="addCalc('0')">0</button>
            <button class="calc-btn" onclick="addCalc('.')">.</button>
        </div>
    </div>
</div>

<script>
    let puntos = 0;
    let respuestaCorrecta;
    let desbloqueada = false;
    let pinIntento = "";
    const PIN_SECRETO = "2026";

    const nombres = ["Hugo", "Sofía", "Mateo", "Lucía", "Leo", "Martina", "Daniela"];
    const cosas = ["canicas", "pegatinas", "manzanas", "caramelos", "lápices"];

    function generarProblema() {
        let cat = document.getElementById('selector-categoria').value;
        if (cat === "aleatorio") {
            const opciones = ["Suma sin llevada", "Suma con llevada", "Resta sin llevada", "Resta con llevada", "Suma y resta llevando", "Multiplicar"];
            cat = opciones[Math.floor(Math.random() * opciones.length)];
        }
        document.getElementById('tag').innerText = cat;
        document.getElementById('respuesta-usuario').value = "";
        document.getElementById('respuesta-usuario').focus();
        document.getElementById('feedback').innerText = "";

        let a, b, c, texto;
        const n1 = nombres[Math.floor(Math.random() * nombres.length)];
        const o = cosas[Math.floor(Math.random() * cosas.length)];

        // Generación lógica para evitar que el resultado sea 2026
        do {
            if (cat === 'Suma sin llevada') {
                a = Math.floor(Math.random() * 40) + 11;
                b = Math.floor(Math.random() * 40) + 11;
                while ((a % 10 + b % 10) > 9) b--;
                respuestaCorrecta = a + b;
                texto = `${n1} tiene ${a} ${o} y compra otras ${b}. ¿Cuántas ${o} tiene en total ahora?`;
            } else if (cat === 'Suma con llevada') {
                a = Math.floor(Math.random() * 35) + 20;
                b = Math.floor(Math.random() * 35) + 20;
                while ((a % 10 + b % 10) < 10) b++;
                respuestaCorrecta = a + b;
                texto = `Había ${a} ${o} y metemos ${b} más. ¿Cuántas ${o} hay ahora en total?`;
            } else if (cat === 'Resta sin llevada') {
                a = Math.floor(Math.random() * 40) + 55;
                b = Math.floor(Math.random() * 40) + 10;
                while (a % 10 < b % 10) b--;
                respuestaCorrecta = a - b;
                texto = `${n1} tenía ${a} ${o} y ha regalado ${b}. ¿Cuántas ${o} le quedan?`;
            } else if (cat === 'Resta con llevada') {
                a = Math.floor(Math.random() * 40) + 45;
                b = Math.floor(Math.random() * 25) + 16;
                while (a % 10 >= b % 10) b++;
                respuestaCorrecta = a - b;
                texto = `Teníamos ${a} ${o} y se han usado ${b}. ¿Cuántas ${o} nos quedan?`;
            } else if (cat === 'Suma y resta llevando') {
                a = 40; b = 25; c = 18;
                respuestaCorrecta = a + b - c;
                texto = `${n1} tiene ${a} ${o}, gana ${b} y luego pierde ${c}. ¿Cuántas tiene ahora?`;
            } else {
                a = Math.floor(Math.random() * 8) + 2;
                b = Math.floor(Math.random() * 9) + 1;
                respuestaCorrecta = a * b;
                texto = `Si compras ${a} paquetes con ${b} ${o} cada uno, ¿cuántas ${o} tienes en total?`;
            }
        } while (respuestaCorrecta == 2026);

        document.getElementById('enunciado').innerText = texto;
    }

    function verificarRespuesta() {
        const input = document.getElementById('respuesta-usuario');
        if (parseInt(input.value) === respuestaCorrecta) {
            puntos += 10;
            document.getElementById('puntos').innerText = puntos;
            document.getElementById('feedback').innerText = "¡Correcto! 🌟";
            document.getElementById('feedback').style.color = "var(--accent)";
            setTimeout(generarProblema, 1500);
        } else {
            document.getElementById('feedback').innerText = "¡Inténtalo de nuevo! 💪";
            document.getElementById('feedback').style.color = "var(--secondary)";
        }
    }

    // Calculadora con PIN oculto
    let calcVal = "";
    function addCalc(v) {
        if (!desbloqueada) {
            pinIntento += v;
            document.getElementById('calc-display').innerText = "*".repeat(pinIntento.length);
            if (pinIntento === PIN_SECRETO) {
                desbloqueada = true;
                const panel = document.getElementById('calc-panel');
                panel.classList.add('unlocked');
                document.getElementById('lock-status').innerText = "ABIERTA ✅";
                document.getElementById('calc-display').innerText = "0";
                calcVal = "";
            } else if (pinIntento.length >= 4) {
                pinIntento = "";
                document.getElementById('calc-display').innerText = "PIN ERROR";
            }
            return;
        }
        calcVal += v;
        document.getElementById('calc-display').innerText = calcVal;
    }

    function solveCalc() {
        if (!desbloqueada) return;
        try {
            calcVal = eval(calcVal).toString();
            document.getElementById('calc-display').innerText = calcVal;
        } catch { clearCalc(); }
    }

    function clearCalc() {
        calcVal = ""; pinIntento = "";
        document.getElementById('calc-display').innerText = desbloqueada ? "0" : "Introducir PIN";
    }

    document.getElementById('respuesta-usuario').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') verificarRespuesta();
    });

    generarProblema();
</script>

</body>
</html>
